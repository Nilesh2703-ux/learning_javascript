<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = Math.round(10.4);
        document.write(`Round of value round : ${a} <br>`);
        var b = Math.trunc(10.9);
        document.write(`Round of value truc : ${b} <br>`);
        var c = Math.ceil(6.18);
        document.write(`Round of value ceil : ${c} <br>`);
        var d = Math.floor(6.98);
        document.write(`Round of value floor : ${d} <br>`);
        var e = Math.max(34,12,56,78,21,30);
        document.write(`max value : ${e} <br>`);
        var f = Math.sqrt(81);
        document.write(`Square root : ${f} <br>`);
        var g = Math.cbrt(125);
        document.write(`Cube root : ${g} <br>`);
        var h = Math.pow(3,4);
        document.write(`Power : ${h} <br>`);

        var i = Math.random();
        document.write(`Random value : ${i} <br>`);

        var j = Math.floor(Math.random() *1000);
        document.write(`Random value : ${j} <br>`);
    </script>
</body>
</html>
