<!DOCTYPE html>

<head>

<body>
    <script>
        let cars = ["BMW","HONDA","TESLA","HUNDAI","MAHINDRA"];
        
        for(let i=0;i<cars.length;i++){
            console.log(cars[i]);
        }

    <script>
        let array = [10,20,30,40,50];
        sum = 0;
        document.write("<ul>");
        for(let i=0;i<array.length;i++){
            document.write("<li>" + array[i] + "</li>")
            sum += array[i];
        }
        document.write("</ul>");
        document.write(sum);
    </script>
</body>
