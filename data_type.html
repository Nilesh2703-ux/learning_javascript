<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 'Nilesh'; //string
        var b = 112.34; //number
        var c =  true;  //boolean
        var d = ["HTML","CSS","BOOTSTRAP"]; //object
        var e = {faname:"Nilesh",lname:"Wadhave"}; //object
        var f = null; //object
        var g; //undefined

        function myfunc(){ //function
            return "Hello";
        }
        myfunc();
        document.write(typeof a +"<br>" + a + "<br>");
        document.write(typeof b +"<br>" + b + "<br>");
        document.write(typeof c +"<br>" + c + "<br>");
        document.write(typeof d +"<br>" + d + "<br>");
        document.write(typeof e +"<br>" + e + "<br>");
        document.write(typeof f +"<br>" + f + "<br>");
        document.write(typeof g +"<br>" + g + "<br>");
        document.write(typeof myfunc() +"<br>" + myfunc() + "<br>");



    </script>
</body>
</html>
